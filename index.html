<!DOCTYPE html>
<html>
<head>
    <title>Redirigiendo a VetSync...</title>
    <script>
        // Captura los parámetros (el token de acceso) que envía Facebook
        var hash = window.location.hash;
        // Redirige a la aplicación usando el esquema personalizado
        window.location.href = "vetsync://" + hash;
    </script>
</head>
<body>
    <p>Redirigiendo a la aplicación, por favor espera...</p>
</body>
